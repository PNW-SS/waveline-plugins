name: Plugin packages

on:
  push:
    branches: [develop, staging, alpha, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    name: Validate and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate production manifests, URL, and marketplace entries
        run: python scripts/package.py validate
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package.py validate --tag "$RELEASE_TAG"
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate with Claude's CLI
        run: |
          npx --yes --package @anthropic-ai/claude-code@2.1.234 claude plugin validate --strict plugins/waveline
          npx --yes --package @anthropic-ai/claude-code@2.1.234 claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Build platform archives and checksums
        run: python scripts/package.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: waveline-plugin-packages
          path: |
            dist/waveline-openai-*.zip
            dist/waveline-claude-*.zip
            dist/SHA256SUMS.txt
            dist/PRODUCTION-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release production packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build reviewed tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package.py build --tag "$RELEASE_TAG"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Waveline plugins $version" --notes-file docs/release-notes.md \
            "dist/waveline-openai-$version.zip" "dist/waveline-claude-$version.zip" dist/PRODUCTION-SHA256SUMS.txt
